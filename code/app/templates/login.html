<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Login</title>
</head>
<body>
  <h2>Login</h2>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
        {% for msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="POST">
    <div>
      <label>Username</label>
      <input name="username" />
    </div>
    <div>
      <label>Password</label>
      <input name="password" type="password" />
    </div>
    <button type="submit">Login</button>
  </form>

  <p><a href="/signup">Signup</a></p>
</body>
</html>
